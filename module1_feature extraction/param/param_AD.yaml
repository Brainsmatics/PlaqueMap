imageType:
  Original: {}
  Wavelet: {}
  #LoG:
  #  sigma: [2.0, 3.0, 4.0, 5.0]
  #Wavelet: {}

featureClass:
  shape2D:
    - 'MeshSurface'
    - 'PixelSurface'
    - 'Perimeter'
    - 'PerimeterSurfaceRatio'
    - 'Sphericity'
    - 'SphericalDisproportion'
    - 'MaximumDiameter'
    - 'MajorAxisLength'
    - 'MinorAxisLength'
    - 'Elongation'
    
#   firstorder:
#   glcm:
#   glrlm:
#   glszm:
#   gldm:
#   ngtdm:
  glcm:  # Disable SumAverage by specifying all other GLCM features available   #already used
    - 'Autocorrelation'
    - 'JointAverage'
    - 'ClusterProminence'
    - 'ClusterShade'
    - 'ClusterTendency'
    - 'Contrast'
    - 'Correlation'
    - 'DifferenceAverage'
    - 'DifferenceEntropy'
    - 'DifferenceVariance'
    - 'JointEnergy'
    - 'JointEntropy'
    - 'Imc1'
    - 'Imc2'
    - 'Idm'
    - 'Idmn'
    - 'Id'
    - 'Idn'
    - 'InverseVariance'
    - 'MaximumProbability'
    - 'SumEntropy'
    - 'SumSquares'
#  glrlm: # for lists none values are allowed, in this case, all features are enabled
  glszm:                          #already used          
    - 'GrayLevelVariance'
    - 'ZoneVariance'
    - 'SizeZoneNonUniformity'
    - 'GrayLevelNonUniformity'
    - 'SmallAreaHighGrayLevelEmphasis'
    - 'LargeAreaLowGrayLevelEmphasis'
    - 'LargeAreaHighGrayLevelEmphasis'
    - 'SmallAreaLowGrayLevelEmphasis'
    - 'SmallAreaEmphasis'
    - 'LargeAreaEmphasis'
    - 'GrayLevelNonUniformityNormalized'
    - 'SizeZoneNonUniformityNormalized'
    - 'ZonePercentage'
    - 'ZoneEntropy'
    - 'LowGrayLevelZoneEmphasis'
    - 'HighGrayLevelZoneEmphasis'
 #####     
  ngtdm:     #####                         
    - 'Coarseness'
    - 'Contrast'
    - 'Busyness'
    - 'Complexity'
    - 'Strength'
 #####    
  gldm:  # contains deprecated features, but as no individual features are specified, the deprecated features are not enabled
    - 'SmallDependenceEmphasis'
    - 'LargeDependenceEmphasis'
    - 'GrayLevelNonUniformity'
    - 'DependenceNonUniformity'
    - 'DependenceNonUniformityNormalized'
    - 'GrayLevelVariance'
    - 'DependenceVariance'
    - 'DependenceEntropy'
    - 'LowGrayLevelEmphasis'
    - 'HighGrayLevelEmphasis'
    - 'SmallDependenceLowGrayLevelEmphasis'
    - 'SmallDependenceHighGrayLevelEmphasis'
    - 'LargeDependenceLowGrayLevelEmphasis'
    - 'LargeDependenceHighGrayLevelEmphasis'

setting:
  # Normalization:
  #normalize: true
  #normalizeScale: 100
  
  
  # Resampling:
  # first dimensions always correspond to in-plane resolution.
  # Z-plane resolution should not be modified to avoid mask errors (> than 1 slice after resampling)
  interpolator: 'sitkBSpline'
  #resampledPixelSpacing: [2, 2, 0]
  #padDistance: 10
  #preCrop: true


  # 2D settings
  # force2Ddimension setting is relative to the acquisition plane.
  # For example, the axial plane (0) corresponds to the acquisition plane (axial, sagittal or coronal) of the MRI volume.
  # Therefore, in most cases this setting should not be modified.
  force2D: true
  force2Ddimension: 0
  
  # Image discretization:
  # This parameter should be estimated by analyzing the dataset firstorder range and chosen to be as close as possible to the 30-130 range. 
  binWidth: 5

  # first order specific settings:
  voxelArrayShift: 0

  # Misc:
  label: 1